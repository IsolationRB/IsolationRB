<!doctype html>
<html lang="en">
	<head>
		<title>JS Functions</title>
		<script>
			function getTheData2(){
				let txt = document.getElementById("getData2");
				//take the text and use it
				alert("getTheData2() " +txt.value);
			}
		</script>
	</head>
	<body>
		<form>
			<label> Enter Name:</label>
			<input type="text" id="getData2">
		</form>
		<button type="button" onclick="getTheData2()">Submit</button>
	</body>
</html>
